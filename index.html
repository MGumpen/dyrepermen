<!DOCTYPE html>
<html lang="no">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dyrepermen</title>
    <meta name="description" content="Dyrepermen er under produksjon." />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="light dark" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐾</text></svg>"
    />
    <style>
      :root {
        --bg: #f6f5f2;
        --surface: #ffffff;
        --text: #1c1b19;
        --muted: #6b6862;
        --border: #e4e1da;
        --accent: #3f6f4e;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #14161a;
          --surface: #1b1e23;
          --text: #f2f1ee;
          --muted: #9aa0a6;
          --border: #2a2e35;
          --accent: #7fb994;
        }
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background: var(--bg);
        color: var(--text);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }

      main {
        width: min(32rem, 100%);
        padding: clamp(1.75rem, 5vw, 3rem);
        text-align: center;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 1rem;
      }

      .mark {
        font-size: 3rem;
        line-height: 1;
      }

      h1 {
        margin: 1.25rem 0 0;
        font-size: clamp(1.5rem, 4vw, 2rem);
        font-weight: 600;
        letter-spacing: -0.01em;
        text-wrap: balance;
      }

      p {
        margin: 0.75rem 0 0;
        color: var(--muted);
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        margin-top: 1.75rem;
        padding: 0.35rem 0.85rem;
        border: 1px solid var(--border);
        border-radius: 999px;
        font-size: 0.8125rem;
        color: var(--accent);
      }

      .status::before {
        content: "";
        width: 0.5rem;
        height: 0.5rem;
        border-radius: 50%;
        background: currentColor;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" role="img" aria-label="Poteavtrykk">🐾</div>
      <h1>Dyrepermen er under produksjon.</h1>
      <p>Vi bygger noe bra for deg og dyra dine. Kom tilbake snart.</p>
      <p class="status">Under utvikling</p>
    </main>
  </body>
</html>
