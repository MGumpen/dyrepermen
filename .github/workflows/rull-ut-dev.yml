name: Rull ut dev

# Speiler rull-ut.yml for produksjon, men mot dev-branchen, Neon-branchen
# "dev" og Render-tjenesten dyrepermen-dev.
#
# Rekkefolgen er ikke valgfri: bygg -> test -> migrer -> rull ut -> roykttest.
# Rulles appen ut for migrasjonene, moter ny kode et gammelt skjema.
on:
  workflow_run:
    workflows: ["Bygg og test"]
    branches: [dev]
    types: [completed]
  workflow_dispatch:

# To samtidige utrullinger ville kjort migrasjoner mot samme database
# samtidig. Avbrytes en migrasjon halvveis, star databasen i en tilstand
# ingen har designet.
concurrency:
  group: dev
  cancel-in-progress: false

jobs:
  rull-ut:
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      # workflow_run sjekker ut standardbranchen om ingen ref oppgis. Da
      # ville migrasjonsskriptet blitt generert fra main, ikke fra koden som
      # nettopp besto testene.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Installer EF-verktoy
        run: dotnet tool install --global dotnet-ef

      - name: Generer idempotent migrasjonsskript
        # Program.cs kaster hvis tilkoblingsstrengen mangler, og dotnet ef
        # kjorer Program.cs for a bygge DbContext. Skriptgenerering roerer
        # ikke databasen, sa verdien trenger bare aa vaere gyldig syntaks.
        env:
          ConnectionStrings__Postgres: "Host=ikke-i-bruk;Database=dyrepermen"
        run: >-
          dotnet ef migrations script --idempotent
          --project src/Dyrepermen.Infrastructure
          --startup-project src/Dyrepermen.Web
          --output migrations.sql

      - name: Kjor migrasjoner
        # ON_ERROR_STOP=1 er kritisk. Uten den fortsetter psql etter en
        # feilet setning og rapporterer suksess, mens skjemaet er halvferdig.
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations.sql

      - name: Utlos utrulling
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"

      - name: Vent og roykttest
        # Gratisinstansen bruker opptil et minutt paa aa starte, og Render
        # bygger imaget forst. Fem minutter er romslig, ikke sloset.
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "${{ secrets.APP_URL }}/helse" > /dev/null; then
              echo "Oppe etter $i forsok"; exit 0
            fi
            sleep 10
          done
          echo "Appen svarte ikke innen fem minutter"; exit 1
