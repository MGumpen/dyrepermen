# To web-tjenester paa Render, en per branch. Samme image, samme Dockerfile -
# forskjellen er hvilken branch som bygges og hvilken Neon-branch de peker paa.
#
# Denne fila er foreloepig dokumentasjon, ikke en aktiv Render-blueprint.
# Tjenestene opprettes manuelt i Render-dashbordet, fordi main ennaa ikke
# inneholder kildekoden - en blueprint ville forsokt aa bygge produksjon fra
# en branch uten Dockerfile og feilet. Naar main har koden, kan fila kobles
# opp som blueprint og overta styringen.

services:
  # Testmiljo paa dev.dyrepermen.no. Bygges fra dev-branchen og peker paa
  # Neon-branchen "dev". Kjorer med ASPNETCORE_ENVIRONMENT=Production med
  # vilje: et testmiljo som oppforer seg annerledes enn produksjon tester
  # ikke produksjon. Utviklerfeilsiden hoerer hjemme lokalt.
  - type: web
    name: dyrepermen-dev
    runtime: docker
    plan: free
    region: frankfurt
    branch: dev

    dockerfilePath: infra/Dockerfile
    dockerContext: .

    healthCheckPath: /helse
    autoDeploy: false

    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: TZ
        value: Europe/Oslo
      - key: ConnectionStrings__Postgres
        sync: false
      - key: Jobb__Nokkel
        generateValue: true

  # Produksjon paa dyrepermen.no. Bygges fra main og peker paa Neon-branchen
  # "production".
  - type: web
    name: dyrepermen
    runtime: docker
    plan: free
    region: frankfurt
    branch: main

    # Byggekonteksten er repo-roten, ikke infra/. Se plan kapittel 3.5.
    dockerfilePath: infra/Dockerfile
    dockerContext: .

    healthCheckPath: /helse

    # Bevisst av. Utrulling skjer fra .github/workflows/rull-ut.yml, etter at
    # testene er gronne og migrasjonene er kjort - ikke ved hver push.
    # Rulles appen ut for migrasjonene, moter ny kode et gammelt skjema.
    autoDeploy: false

    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production

      # Sammen med InvariantGlobalization=false er dette det som gjor at
      # tidspunkter vises riktig lokalt. Mangler en av dem, kaster
      # tidssonekonverteringen i containeren.
      - key: TZ
        value: Europe/Oslo

      # sync: false betyr at verdien settes manuelt i Render-dashbordet og
      # aldri havner i repoet. Npgsql-format (nokkel/verdi), ikke postgres://.
      - key: ConnectionStrings__Postgres
        sync: false

      # Delt hemmelighet for POST /jobb/paminnelser. Samme verdi ma legges
      # inn som JOBB_NOKKEL i GitHub-hemmelighetene.
      - key: Jobb__Nokkel
        generateValue: true
